product:
  type: kmp/lib
  platforms: [ jvm ]

dependencies:
  - //core-engine
  - //ui-features
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kotlinx.coroutines.core
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.koin.test

settings:
  compose:
    enabled: true
    resources:
      packageName: org.andrew.jpad.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
